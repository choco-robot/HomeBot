<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeBot 麻将机器人 - 音视频终端</title>
    <!-- 腾讯云 TRTC Web SDK -->
    <script src="https://web.sdk.qcloud.com/trtc/webrtc/v5/dist/trtc.js"></script>
    <!-- 本地调试用的 UserSig 生成库（生产环境应从后端获取） -->
    <script src="https://web.sdk.qcloud.com/trtc/webrtc/v5/libs/lib-generate-test-usersig.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #0f0;
            height: 100vh;
            overflow: hidden;
        }
        
        #status-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40px;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            z-index: 100;
            border-bottom: 1px solid #333;
        }
        
        .status-left { display: flex; gap: 20px; align-items: center; }
        .status-item { display: flex; gap: 6px; align-items: center; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ff4444;
        }
        .status-dot.connected { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .status-dot.pending { background: #ffaa00; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        #main-grid {
            position: absolute;
            top: 40px; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 1fr;
            gap: 2px;
            background: #111;
        }
        
        .video-panel {
            position: relative;
            background: #000;
            overflow: hidden;
        }
        
        .video-panel video {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .panel-label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
            z-index: 10;
        }
        
        .panel-info {
            position: absolute;
            bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #aaa;
            z-index: 10;
            max-width: 90%;
            word-break: break-all;
        }
        
        #remote-audio-indicator {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            color: #00ff88;
            display: none;
        }
        
        #error-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff4444;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }
        
        #error-overlay h2 { margin-bottom: 10px; }
        #error-overlay p { color: #aaa; font-size: 13px; }
        
        .btn-retry {
            margin-top: 20px;
            padding: 10px 24px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="status-bar">
        <div class="status-left">
            <div class="status-item">
                <div class="status-dot pending" id="dot-trtc"></div>
                <span id="text-trtc">TRTC 连接中...</span>
            </div>
            <div class="status-item">
                <div class="status-dot pending" id="dot-top"></div>
                <span>顶置摄像头</span>
            </div>
        </div>
        <div class="status-item">
            <span id="room-info">Room: --</span>
        </div>
    </div>
    
    <div id="main-grid">
        <!-- 顶置摄像头（牌桌视角）-->
        <div class="video-panel">
            <div class="panel-label">顶置摄像头 - 牌桌视角</div>
            <div class="panel-info" id="info-top">初始化中...</div>
            <video id="video-top" autoplay muted playsinline></video>
        </div>
        
        <!-- 远端视频（远程玩家）-->
        <div class="video-panel">
            <div class="panel-label">远程玩家</div>
            <div class="panel-info" id="info-remote">等待连接...</div>
            <div id="container-remote" style="width:100%; height:100%;"></div>
            <div id="remote-audio-indicator">🔊 正在播放远程音频</div>
        </div>
    </div>
    
    <div id="error-overlay">
        <h2>连接异常</h2>
        <p id="error-message"></p>
        <button class="btn-retry" onclick="location.reload()">重新加载</button>
    </div>

    <script>
        // ============================================================
        // 配置区 - 优先从后端 API 获取配置
        // ============================================================
        const FALLBACK_SDKAPPID = 0;
        const FALLBACK_SECRETKEY = 'YOUR_SECRET_KEY';
        const FALLBACK_ROOMID = 'mahjong_room_001';
        const USERID = 'robot';
        
        // 后端 API 地址（自动检测当前协议和主机）
        const API_BASE_URL = (() => {
            if (window.location.protocol.startsWith('http')) {
                return `${window.location.protocol}//${window.location.host}`;
            }
            return 'http://localhost:5200';
        })();
        
        // ============================================================
        
        let trtc = null;
        let config = null;
        let remoteUserCount = 0;
        
        function setStatus(id, status, text) {
            const dot = document.getElementById('dot-' + id);
            const txt = document.getElementById('text-' + id);
            if (dot) {
                dot.classList.remove('connected', 'pending');
                dot.classList.add(status);
            }
            if (txt && text) txt.innerText = text;
        }
        
        function setInfo(id, text) {
            const el = document.getElementById('info-' + id);
            if (el) el.innerText = text;
        }
        
        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-overlay').style.display = 'flex';
        }
        
        async function fetchTRTCConfig() {
            try {
                console.log('[TRTC] 从后端获取配置:', `${API_BASE_URL}/api/trtc/usersig?userid=${USERID}`);
                const response = await fetch(`${API_BASE_URL}/api/trtc/usersig?userid=${USERID}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    console.log('[TRTC] 已从后端获取配置');
                    return {
                        sdkAppId: data.sdkAppId,
                        userSig: data.userSig,
                        roomId: data.roomId || FALLBACK_ROOMID,
                        fromBackend: true
                    };
                } else {
                    throw new Error(data.error || '后端返回错误');
                }
            } catch (e) {
                console.warn('[TRTC] 无法从后端获取配置:', e.message);
                if (FALLBACK_SDKAPPID !== 0 && FALLBACK_SECRETKEY !== 'YOUR_SECRET_KEY') {
                    console.log('[TRTC] 使用本地备用配置');
                    return {
                        sdkAppId: FALLBACK_SDKAPPID,
                        roomId: FALLBACK_ROOMID,
                        fromBackend: false
                    };
                }
                throw new Error(`无法获取 TRTC 配置: ${e.message}`);
            }
        }
        
        function genLocalUserSig(userId, sdkAppId, secretKey) {
            try {
                const generator = new window.LibGenerateTestUserSig(sdkAppId, secretKey, 604800);
                return generator.genTestUserSig(userId);
            } catch (e) {
                console.error('生成 UserSig 失败:', e);
                throw e;
            }
        }
        
        async function init() {
            console.log('[Init] API_BASE_URL:', API_BASE_URL);
            
            try {
                // 1. 获取 TRTC 配置
                config = await fetchTRTCConfig();
                document.getElementById('room-info').innerText = `Room: ${config.roomId}`;
                console.log(`[TRTC] 配置来源: ${config.fromBackend ? '后端API' : '本地配置'}`);
                
                if (!config.fromBackend && (!config.sdkAppId || config.sdkAppId === 0)) {
                    showError('无法获取 TRTC 配置\n\n请确保桥接服务已启动，并检查 API_BASE_URL 设置');
                    return;
                }
                
                // 2. 创建 TRTC 实例
                trtc = TRTC.create();
                console.log('[TRTC] 实例创建成功');
                
                // 3. 枚举摄像头设备
                const devices = await trtc.getCameraList();
                console.log('[TRTC] 可用摄像头:', devices);
                
                if (devices.length < 1) {
                    showError('未检测到摄像头');
                    return;
                }
                
                // 使用第一个设备作为顶置摄像头（牌桌视角）
                // 如果系统中有多个摄像头，顶置摄像头应被配置为默认设备
                const topDevice = devices.find(d => d.label.toLowerCase().includes('top')) 
                    || devices.find(d => d.label.toLowerCase().includes('usb')) 
                    || devices[0];
                
                setInfo('top', topDevice.label || 'Camera 0');
                
                // 4. 准备 UserSig
                let userSig = config.userSig;
                if (!userSig && !config.fromBackend) {
                    userSig = genLocalUserSig(USERID, config.sdkAppId, FALLBACK_SECRETKEY);
                }
                
                // 5. 进入房间
                const roomIdNum = parseInt(config.roomId) || 8888;
                await trtc.enterRoom({
                    sdkAppId: config.sdkAppId,
                    userId: USERID,
                    userSig: userSig,
                    roomId: roomIdNum
                });
                console.log('[TRTC] 已进入房间:', roomIdNum);
                setStatus('trtc', 'connected', 'TRTC 已连接');
                
                // 6. 开启本地音视频（顶置摄像头）
                await trtc.startLocalAudio();
                await trtc.startLocalVideo({ 
                    view: 'video-top',
                    cameraId: topDevice.deviceId
                });
                setStatus('top', 'connected');
                console.log('[TRTC] 顶置摄像头推流已启动');
                
                // 7. 监听远端视频（远程玩家）
                trtc.on(TRTC.EVENT.REMOTE_VIDEO_AVAILABLE, ({ userId, streamType }) => {
                    console.log('[TRTC] 远端视频可用:', userId, streamType);
                    remoteUserCount++;
                    document.getElementById('info-remote').innerText = `用户: ${userId}`;
                    trtc.startRemoteVideo({ userId, streamType, view: 'container-remote' });
                    document.getElementById('remote-audio-indicator').style.display = 'block';
                });
                
                trtc.on(TRTC.EVENT.REMOTE_VIDEO_UNAVAILABLE, ({ userId, streamType }) => {
                    console.log('[TRTC] 远端视频停止:', userId, streamType);
                    remoteUserCount = Math.max(0, remoteUserCount - 1);
                    if (remoteUserCount === 0) {
                        document.getElementById('info-remote').innerText = '等待连接...';
                        document.getElementById('remote-audio-indicator').style.display = 'none';
                    }
                });
                
                // 监听被踢出房间
                trtc.on(TRTC.EVENT.KICKED_OUT, (error) => {
                    console.error('[TRTC] 被踢出房间:', error);
                    setStatus('trtc', 'pending', '连接断开');
                    showError(`被踢出房间: ${error.message}`);
                });
                
            } catch (err) {
                console.error('初始化失败:', err);
                setStatus('trtc', 'pending', '连接失败');
                showError(err.message || '未知错误');
            }
        }
        
        window.addEventListener('DOMContentLoaded', init);
        
        // 防止屏幕休眠
        function preventSleep() {
            const silentVideo = document.createElement('video');
            silentVideo.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAACKBtZGF0AAAC';
            silentVideo.loop = true;
            silentVideo.muted = true;
            silentVideo.play().catch(() => {});
        }
        preventSleep();
    </script>
</body>
</html>
